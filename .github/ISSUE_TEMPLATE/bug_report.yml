name: Сообщение об ошибке
description: Что-то сломалось или значение не маскируется
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Не вставляйте реальные персональные данные, ключи и полные логи сессий.**
        Используйте синтетические примеры. Для проблем безопасности см. SECURITY.md
        и сообщайте приватно.
  - type: input
    id: dsh-version
    attributes:
      label: Версия DeepSeek Harness
      placeholder: "например, 0.2.2-rc.5"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и Python
      placeholder: "Windows 11, Python 3.12.7"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим прокси
      options: [strict, audit, off]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. Запустить ...\n2. Отправить ...\n3. Увидеть ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое и фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или фрагмент политики
      description: Удалите персональные данные. Обычно достаточно `audit/blocks-*.jsonl` и `state/proxy.log`.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Подтверждение
      options:
        - label: Я удалил реальные персональные данные и секреты из отчёта
          required: true
        - label: Это не уязвимость безопасности (они идут через SECURITY.md)
          required: true
