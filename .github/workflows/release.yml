name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build release archive
        run: python scripts/build_release.py
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem dist/redactrail-*.zip | ForEach-Object { $_.FullName })
          $files += (Resolve-Path dist/SHA256SUMS).Path
          $files += (Resolve-Path install.ps1).Path
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $env:GITHUB_REF_NAME --yes }
          gh release create $env:GITHUB_REF_NAME @files --title "redactrail $env:GITHUB_REF_NAME" --generate-notes
