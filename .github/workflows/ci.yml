name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Use example policy
        run: Copy-Item policy.example.json policy.json
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Detector benchmark gate
        run: python scripts/bench_detectors.py --corpus tests/corpus/pii_bench.jsonl --gate

  installer:
    name: Installer smoke test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build release archive
        run: python scripts/build_release.py
      - name: Install from local archive
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\redactrail-*.zip | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -SourcePath $zip -InstallDir "$env:RUNNER_TEMP\rt" -NoPython -NoStart
          if (-not (Test-Path "$env:RUNNER_TEMP\rt\policy.json")) { throw "policy.json not created" }
          if (-not (Test-Path "$env:RUNNER_TEMP\rt\redactrail\app.py")) { throw "code not installed" }
      - name: Uninstall
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\uninstall.ps1 -InstallDir "$env:RUNNER_TEMP\rt" -Purge -Force
          if (Test-Path "$env:RUNNER_TEMP\rt") { throw "install dir not removed" }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          ARCHIVE=gitleaks_${VERSION}_linux_x64.tar.gz
          EXPECTED=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${EXPECTED}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan tracked files
        run: |
          mkdir -p scan
          git archive HEAD | tar -x -C scan
          gitleaks dir scan --redact -v --exit-code 1
      - name: Scan history
        run: gitleaks detect --source . --redact -v --exit-code 1
