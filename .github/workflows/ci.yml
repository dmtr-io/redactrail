name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Use example policy
        run: Copy-Item policy.example.json policy.json
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Detector benchmark gate
        run: python scripts/bench_detectors.py --corpus tests/corpus/pii_bench.jsonl --gate
